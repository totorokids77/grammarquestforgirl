<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="claude:viewport-fit-sides" content="cover">
<title>PLA Grammar Quest 스타 편</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Poppins:wght@600;800&family=Noto+Sans+KR:wght@400;600;700;900&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3,p{margin:0}
.disp{font-family:var(--f-disp);letter-spacing:-.01em}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--app);box-shadow:0 0 0 1px var(--line)}
#view{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;padding:4px max(16px,env(safe-area-inset-left,0px)) 18px max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-overflow-scrolling:touch}
.sub{color:var(--sub);font-size:13.5px}
.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.panel h3{font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h3 small,.lbl{color:var(--sub);font-weight:600;font-size:11.5px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);font-weight:700}
.chip{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--chip);color:var(--chipc)}
/* buttons */
.btn{display:block;width:100%;padding:14px;border-radius:var(--rb);font-weight:900;font-size:16px;color:var(--btnc);background:var(--btn);box-shadow:var(--btns);transition:transform .08s,box-shadow .08s;text-align:center;margin-bottom:10px}
.btn:active{transform:translateY(3px);box-shadow:var(--btnsa)}
.btn[disabled]{background:var(--off);color:var(--offc);box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--ghost);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.small{padding:10px;font-size:14px}
.btn.danger{background:var(--bad);color:#fff;box-shadow:none}
.btn.ghost.danger{background:var(--ghost);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
/* bars */
.bar{height:10px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.bar.xp i{background:var(--xp)}.bar.hp i{background:var(--hp)}.bar.mp i{background:var(--mp)}.bar.ult i{background:var(--ult)}
.bar.ult.full i{animation:pulse .8s infinite alternate}
@keyframes pulse{to{filter:brightness(1.6)}}
.lbl{display:flex;justify-content:space-between;gap:8px}
/* hud + nav */
.hud{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--hudbg);border-bottom:1px solid var(--line)}
.ava{width:54px;height:54px;border-radius:50%;overflow:hidden;background:var(--avabg);border:2px solid var(--acc);flex:none}
.ava svg{display:block;width:100%;height:100%}
.info{flex:1;min-width:0}
.info .nm{font-weight:800;font-size:15px;display:flex;flex-direction:column;line-height:1.25}
.info .nm small{font-size:11.5px;color:var(--sub);font-weight:600}
.coin{font-weight:800;font-size:13px;text-align:right;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.coin em{font-style:normal;font-size:11.5px;color:var(--acc2)}
.nav{display:flex;background:var(--navbg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;padding:8px 2px 9px;font-size:11px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button b{font-size:21px;font-weight:400;filter:grayscale(.7);opacity:.8}
.nav button.on{color:var(--acc)}.nav button.on b{filter:none;opacity:1}
/* home */
.hero{border-radius:var(--r);overflow:hidden;position:relative;margin:12px 0;border:1.5px solid var(--line);min-height:210px;display:flex;align-items:flex-end;box-shadow:var(--shadow)}
.hscene,.scene{position:absolute;inset:0}
.hscene svg,.scene svg{width:100%;height:100%;display:block}
.hbody{position:relative;width:100%;padding:70px 16px 14px;background:linear-gradient(transparent,var(--shade) 55%)}
.hbody h2{font-size:23px;line-height:1.25;margin:6px 0 4px;text-wrap:balance;color:#fff}
.hbody p{font-size:13px;color:#e8e4f5;margin-bottom:12px}
.hbody .btn{margin-bottom:0}
.career{list-style:none;margin:0;padding:0;display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
.career li{flex:none;width:78px;text-align:center;padding:8px 4px;border-radius:12px;border:1.5px solid var(--line);opacity:.55;font-size:11px;display:flex;flex-direction:column;gap:1px}
.career li i{font-style:normal;font-size:22px}.career li span{font-weight:800}.career li small{color:var(--sub)}
.career li.done{opacity:1;background:var(--chip)}
.career li.cur{opacity:1;border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset;animation:glow 2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 2px var(--acc) inset,0 0 16px var(--acc)}}
.notecard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin-bottom:12px;border-radius:var(--r);background:var(--panel);border:1.5px dashed var(--bad)}
.notecard b{font-size:26px;font-weight:400}.notecard span{display:flex;flex-direction:column;font-size:12.5px;color:var(--sub)}.notecard strong{color:var(--ink);font-size:14px}
.zrow{margin-bottom:8px}
/* quest */
.zones{display:flex;gap:8px;padding:12px 0 8px;overflow-x:auto}
.zone{flex:none;padding:9px 12px;border-radius:14px;border:1.5px solid var(--line);font-weight:800;font-size:13px;text-align:left;background:var(--panel)}
.zone small{display:block;font-weight:600;font-size:11px;color:var(--sub)}
.zone.on{border-color:var(--acc);background:var(--chip)}
.zhead{position:relative;border-radius:var(--r);overflow:hidden;min-height:130px;display:flex;align-items:flex-end;margin-bottom:12px;border:1.5px solid var(--line)}
.zhead .hbody{padding-top:56px}.zhead .hbody p{margin-bottom:0}
.ch{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.ch.all{border-color:var(--ok)}
.cht{display:flex;gap:10px;align-items:center}
.cic{width:44px;height:44px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:24px;flex:none}
.ctx{flex:1;min-width:0;display:flex;flex-direction:column}.ctx b{font-size:14.5px;line-height:1.3}.ctx span{font-size:12.5px;color:var(--ink);opacity:.85}.ctx em{font-style:normal;font-size:11px;color:var(--sub)}
.cn{font-weight:800;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.stg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sb{flex:1 1 52px;min-width:52px;padding:7px 4px;border-radius:12px;background:var(--track);border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--sub);font-weight:700}
.sb b{font-size:15px;color:var(--ink);font-weight:800}
.sb.boss{border-color:var(--bad)}
.sb.done{background:var(--chip)}.sb.done span{color:var(--acc);font-weight:900;font-size:13px}
.sb.lock{opacity:.5}
/* shop */
.prev{display:flex;gap:12px;align-items:center}.prev>div:last-child{flex:1;min-width:0}
.pv{width:120px;flex:none;border-radius:16px;background:var(--avabg);display:grid;place-items:center;padding:4px}
.pv svg{width:100%;height:auto;display:block}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{border:1.5px solid var(--line);border-radius:12px;text-align:center;padding:6px 2px;display:flex;flex-direction:column;font-size:10.5px;min-width:0}
.slot b{font-size:22px;font-weight:400}.slot small{color:var(--sub)}.slot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.ii{width:42px;height:42px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:23px;flex:none}
.it{flex:1;min-width:0;display:flex;flex-direction:column}.it b{font-size:14px}.it small{color:var(--sub)}.it span{font-size:12px;color:var(--sub)}
.buy{flex:none;min-width:74px;padding:8px 10px;border-radius:12px;background:var(--btn);color:var(--btnc);font-weight:900;font-size:13px}
.buy[disabled]{background:var(--off);color:var(--offc)}
.buy.on{background:var(--ok);color:#06200f}
.item.eq .ii{box-shadow:0 0 0 2px var(--ok)}
/* note + me */
.wq{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px;padding:10px 12px}
.wq summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer;font-size:13.5px}
.wq summary span{color:var(--bad);font-weight:900}
.wi{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.wt{font-size:14.5px;font-weight:600}.wa{font-size:13px;color:var(--ok);margin-top:4px}.we{font-size:12.5px;color:var(--sub);margin-top:2px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px;gap:8px}.kv:last-child{border:0}.kv b{font-variant-numeric:tabular-nums}
.rk{font-weight:800;color:var(--acc);margin-bottom:6px}
.ach{display:flex;gap:10px;align-items:center;padding:6px 0;opacity:.5}.ach.on{opacity:1}
.ach b{font-size:24px;font-weight:400;width:34px;text-align:center}.ach span{display:flex;flex-direction:column;font-size:12px;color:var(--sub)}.ach strong{color:var(--ink);font-size:13.5px}
.trg{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.tr{border:1.5px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;opacity:.45;font-size:10px;display:flex;flex-direction:column;min-width:0}
.tr b{font-size:24px;font-weight:400}.tr.on{opacity:1;background:var(--chip)}.tr span{line-height:1.2}
.tg{padding:4px 14px;border-radius:99px;background:var(--off);color:var(--offc);font-weight:900;font-size:12px}.tg.on{background:var(--ok);color:#06200f}
.ta{width:100%;border-radius:12px;border:1.5px solid var(--line);background:var(--track);color:var(--ink);padding:10px;font:inherit;margin-bottom:10px}
/* battle */
.bhud{display:flex;gap:8px;align-items:center;padding:10px max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:var(--hudbg);border-bottom:1px solid var(--line)}
.bhud .bb{flex:1;min-width:0}.bhud .lbl{font-size:10.5px}
.back{width:34px;height:34px;border-radius:50%;background:var(--track);font-weight:900;flex:none}
.pips{display:flex;gap:5px;padding:8px 16px;background:var(--hudbg)}
.pips i{flex:1;height:6px;border-radius:9px;background:var(--track)}.pips i.on{background:var(--acc)}.pips i.win{background:var(--ok)}.pips i.lose{background:var(--bad)}
.arena{position:sticky;top:0;z-index:6;height:200px;border-radius:var(--r);overflow:hidden;margin:8px 0 10px;border:1.5px solid var(--line);box-shadow:var(--shadow)}
.pl{position:absolute;left:3%;bottom:4%;width:100px;transition:transform .2s;z-index:2}
.pl svg{width:100%;height:auto;display:block;overflow:visible}
.foe{position:absolute;right:5%;bottom:8%;width:46%;text-align:center;z-index:2}
.foe .spr{display:block;font-size:72px;line-height:1.05;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55));animation:bob 2.4s ease-in-out infinite}
.foe.bossf .spr{font-size:96px;filter:drop-shadow(0 0 22px var(--bossglow))}
@keyframes bob{50%{transform:translateY(-7px)}}
.nm2{font-size:12px;font-weight:800;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:2px 10px;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhp{height:8px;border-radius:9px;background:rgba(0,0,0,.5);overflow:hidden;margin:5px auto 2px;width:78%}.fhp i{display:block;height:100%;background:var(--foehp);transition:width .4s}
.arena.run .pl{animation:slideL .65s ease both}.arena.run .foe{animation:slideR .65s ease both}
@keyframes slideL{from{transform:translateX(-140px);opacity:0}}@keyframes slideR{from{transform:translateX(140px);opacity:0}}
.pl.atk{animation:atk .45s ease}
@keyframes atk{35%{transform:translateX(clamp(60px,40vw,170px))}70%{transform:translateX(clamp(60px,40vw,170px))}}
.foe.hit .spr{animation:hit .4s}
@keyframes hit{20%{transform:translateX(12px) scale(.9);filter:brightness(2.6)}60%{transform:translateX(-8px)}}
.foe.die .spr{transition:all .5s;opacity:.15;transform:translateY(20px) scale(.6) rotate(12deg)}
.foe.fatk{animation:fatk .45s}
@keyframes fatk{35%{transform:translateX(calc(-1*clamp(60px,36vw,150px)))}70%{transform:translateX(calc(-1*clamp(60px,36vw,150px)))}}
.pl.hurt{animation:hurt .45s}
@keyframes hurt{20%{transform:translateX(-12px);filter:brightness(2) saturate(2)}50%{transform:translateX(8px)}}
.banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--f-disp);font-size:34px;font-weight:900;color:var(--bc,#fff);text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 20px var(--bc);opacity:0;pointer-events:none;z-index:5;letter-spacing:.04em}
.banner.go{animation:ban 1.1s ease}
@keyframes ban{0%{opacity:0;transform:scale(2.2)}18%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(.95) translateY(-10px)}}
.shk{animation:shk .35s}
@keyframes shk{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.danger::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 60px rgba(255,40,70,.55);animation:dg 1s infinite alternate;z-index:30}
@keyframes dg{from{opacity:.35}to{opacity:1}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:90;animation:fl .55s ease forwards}
.flash.hurt{background:radial-gradient(circle,transparent 30%,rgba(255,30,60,.55))}.flash.crit{background:radial-gradient(circle,rgba(255,230,140,.5),transparent 70%)}.flash.lv{background:radial-gradient(circle,rgba(255,255,255,.7),transparent 70%)}
@keyframes fl{from{opacity:1}to{opacity:0}}
.float{position:fixed;z-index:95;font-weight:900;font-size:22px;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.6),0 0 10px rgba(0,0,0,.4);animation:fly 1.1s ease forwards;white-space:nowrap;font-family:var(--f-disp)}
.float.big{font-size:32px}
@keyframes fly{from{opacity:1;transform:translateY(0) scale(.7)}25%{transform:translateY(-14px) scale(1.15)}to{opacity:0;transform:translateY(-70px)}}
.pt{position:fixed;z-index:94;width:9px;height:9px;border-radius:50%;pointer-events:none;font-size:15px;line-height:1;width:auto;height:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 16px;border-radius:99px;font-weight:800;font-size:13px;z-index:100;max-width:90vw;text-align:center;animation:in .25s}
/* question card */
.qcard{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.tp{font-size:12.5px;font-weight:700;color:var(--tpc);background:var(--tpbg);border-radius:10px;padding:7px 10px;margin-bottom:8px;line-height:1.4}
.tp b{font-weight:900;margin-right:4px}
.qm{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-bottom:8px}
.tg2{background:var(--bad);color:#fff;border-radius:99px;padding:0 8px;font-weight:800}
.qt{font-size:16.5px;font-weight:600;line-height:1.7;margin-bottom:12px;word-break:keep-all;overflow-wrap:anywhere}
.qt u{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--acc)}
.opts{display:flex;flex-direction:column;gap:8px}.opts.two{flex-direction:row}.opts.two .opt{flex:1}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:12px;border-radius:14px;background:var(--opt);border:1.5px solid var(--line);font-size:15px;font-weight:600;transition:transform .08s,background .15s}
.opt:active{transform:scale(.98)}
.opt i{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--sub);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:var(--sub)}
.opt span{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.right i{background:var(--ok);border-color:var(--ok);color:#06200f}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}.opt.wrong i{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.gone{opacity:.25;text-decoration:line-through}
.opt[disabled]{cursor:default}
.fin{display:flex;gap:8px}.fin input{flex:1;min-width:0;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--opt);color:var(--ink);font:inherit;font-size:16px}
.fin .btn{width:auto;margin:0;padding:0 16px}
.hintp{margin-top:8px;font-weight:800;color:var(--acc);font-size:14px;letter-spacing:.04em}
.fb{border-radius:var(--r);padding:12px 14px;margin-bottom:10px;font-size:13.5px}
.fb.ok{background:var(--okbg);border:1.5px solid var(--ok)}.fb.no{background:var(--badbg);border:1.5px solid var(--bad)}
.fb b{font-size:15px;display:block;margin-bottom:2px}.fb p{margin-top:3px}.fb u{text-decoration-color:var(--ok);text-underline-offset:3px;font-weight:800}
.bbar{padding:10px max(14px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:var(--navbg);border-top:1px solid var(--line)}
.bbar .btn{margin:0}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.act{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border-radius:12px;background:var(--track);font-size:10.5px;font-weight:700;line-height:1.2;min-width:0}
.act b{font-size:20px;font-weight:400}.act small{color:var(--sub);font-size:10px}
.act[disabled]{opacity:.35}
.act.ready{background:var(--ult);color:#1b0f00;animation:pulse .8s infinite alternate}.act.ready small{color:#1b0f00}
/* result */
.result{text-align:center;padding-top:8px}
.rscene{position:relative;height:150px;border-radius:var(--r);overflow:hidden;margin:12px 0 0;border:1.5px solid var(--line)}
.rscene svg{width:100%;height:100%}
.rhero{width:130px;margin:-84px auto 4px;position:relative;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}.rhero svg{width:100%;height:auto;display:block}
.grade{font-family:var(--f-disp);font-size:70px;font-weight:900;line-height:1;margin:6px 0;color:var(--acc);text-shadow:0 0 30px var(--acc)}
.gC{color:var(--sub);text-shadow:none}.gB{color:var(--acc2)}
.result h1{font-size:26px;margin-bottom:12px}
.rewards{text-align:left}.firstb{margin-top:6px;text-align:center;font-weight:900;color:var(--acc)}
.trophyp{display:flex;gap:12px;align-items:center;text-align:left}.tbig{font-size:44px}.trophyp div:last-child{display:flex;flex-direction:column}
.letter{text-align:left;background:var(--panel2)}.letter b{color:var(--acc)}.letter p{font-size:13.5px;margin-top:2px}
.rbig{font-size:80px;margin-top:40px}
.result.lose h1{margin-bottom:6px}.result.lose .sub{margin-bottom:16px}
/* title */
.title{position:relative;padding-top:0;overflow-x:hidden}
.tscene{position:absolute;left:0;right:0;top:0;height:380px;pointer-events:none;overflow:hidden}.tscene svg{width:100%;height:100%;display:block}
.thead{position:relative;text-align:center;padding-top:max(22px,env(safe-area-inset-top,0px));margin-bottom:14px}
.tlogo{width:min(62%,230px);height:auto;margin:0 auto 10px;display:block;filter:var(--logof)}
.thead h1{font-size:34px;line-height:1.1;margin:6px 0;text-wrap:balance}
.motto{font-family:var(--f-disp);font-size:12px;letter-spacing:.16em;color:var(--sub);margin-bottom:10px}
.story{font-size:13.5px;color:var(--ink);opacity:.9;white-space:pre-line}
.nmi{width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--opt);color:var(--ink);font:inherit;font-size:16px}
.cls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.clsb{border:1.5px solid var(--line);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:var(--opt);min-width:0}
.clsb small{font-size:10.5px;color:var(--sub);line-height:1.3}.clsb strong{font-size:14px}.cav{width:70px;display:block}.cav svg{width:100%;height:auto;display:block}
.clsb.on{border-color:var(--acc);background:var(--chip);box-shadow:0 0 0 2px var(--acc)}
.foot{text-align:center;font-size:11.5px;color:var(--sub);margin-top:6px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:80;padding:20px;animation:in .2s}
.mbox{background:var(--panel);border:2px solid var(--acc);border-radius:22px;padding:20px;width:min(100%,340px);text-align:center;max-height:90vh;overflow:auto}
.mbox h3{margin-bottom:6px}.mbox .sub{margin-bottom:14px}
.lvup .lvav{width:150px;margin:0 auto}.lvup .lvav svg{width:100%;height:auto;display:block}
.lvup h2{font-size:34px;color:var(--acc);margin:4px 0}.lvn{font-size:18px}.rankup{margin:8px 0;color:var(--acc);font-weight:800}.lvs{font-size:12.5px;color:var(--sub);margin:6px 0 14px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:380px){.qt{font-size:15.5px}.banner{font-size:28px}.opts.two{flex-direction:column}}

/* ===== 스토리 컷신 / 액션 연출 ===== */
.cine{position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column;justify-content:flex-end;animation:cfin .4s ease;overflow:hidden;cursor:pointer;user-select:none}
.cine.out{opacity:0;transition:opacity .28s}
@keyframes cfin{from{opacity:0}to{opacity:1}}
.cine .cbg{position:absolute;inset:0;transform:scale(1.12);animation:ckb 22s linear infinite alternate}
.cine .cbg svg{width:100%;height:100%;object-fit:cover}
@keyframes ckb{from{transform:scale(1.08) translateX(-1.5%)}to{transform:scale(1.2) translateX(1.5%)}}
.cine .cshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.08) 35%,rgba(0,0,0,.72))}
.cine .cdrift,.ending .cdrift{position:absolute;inset:0;background:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(2px 2px at 70% 60%,#fff6,transparent),radial-gradient(3px 3px at 45% 80%,#fff5,transparent),radial-gradient(2px 2px at 85% 20%,#fff7,transparent);background-size:240px 240px;animation:cdr 14s linear infinite;pointer-events:none}
@keyframes cdr{from{background-position:0 0}to{background-position:-240px -240px}}
.cine .bars{position:absolute;left:0;right:0;height:9vh;background:#000;z-index:3;animation:cbar .7s ease both}
.cine .bars.top{top:0}.cine .bars.bot{bottom:0}
@keyframes cbar{from{height:0}to{height:9vh}}
.cine .ctitle{position:absolute;top:22%;left:0;right:0;text-align:center;z-index:4;font-size:clamp(22px,6vw,40px);letter-spacing:.18em;color:#fff;text-shadow:0 4px 24px #000;animation:ctt 3.2s ease both;font-family:var(--disp,inherit);font-weight:900}
@keyframes ctt{0%{opacity:0;letter-spacing:.5em}25%,75%{opacity:1;letter-spacing:.18em}100%{opacity:0}}
.cine .cskip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 11vh);right:14px;z-index:6;background:rgba(0,0,0,.5);color:#fff;border:1px solid #fff5;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer}
.cine .cport{position:absolute;bottom:34vh;z-index:4;animation:cpin .35s ease both}
.cine .cport.l{left:6%}.cine .cport.r{right:2%}
@keyframes cpin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.cine .pem{width:min(34vw,150px);height:min(34vw,150px);border-radius:50%;display:grid;place-items:center;font-size:min(18vw,80px);background:radial-gradient(circle,rgba(255,255,255,.18),rgba(0,0,0,.45));border:3px solid var(--c);box-shadow:0 0 34px var(--c),inset 0 0 20px #0008}
.cine .phero{filter:drop-shadow(0 6px 18px #000a)}
.cine .cbox{position:relative;z-index:5;margin:0 12px calc(env(safe-area-inset-bottom,0px) + 11vh);min-height:26vh;padding:14px 16px 18px;border-radius:14px;background:rgba(8,10,24,.82);border:1px solid #ffffff30;backdrop-filter:blur(6px);color:#fff}
.cine .cbox.narr{background:rgba(0,0,0,.55);text-align:center;border-color:transparent;font-style:italic}
.cine .cbox.diary{background:rgba(255,248,225,.92);color:#3a2d18;border-color:#d8b96a}
.cine .cname{font-weight:900;font-size:15px;margin-bottom:6px;min-height:1px}
.cine .ctext{font-size:clamp(15px,4vw,18px);line-height:1.65;white-space:pre-wrap;word-break:keep-all}
.cine .cnext{position:absolute;right:14px;bottom:8px;font-style:normal;font-size:12px;opacity:0;color:var(--acc,#fff)}
.cine .cbox.done .cnext{opacity:1;animation:cbl .8s infinite}
@keyframes cbl{50%{transform:translateY(3px);opacity:.4}}
.cine .cdots{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 9.5vh + 4px);left:0;right:0;display:flex;justify-content:center;gap:4px;z-index:6;flex-wrap:wrap;padding:0 20px}
.cine .cdots i{width:5px;height:5px;border-radius:50%;background:#fff3}.cine .cdots i.on{background:#fffd}
.cine.shk{animation:cshk .45s}
@keyframes cshk{20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-2px)}}
.cflash{position:absolute;inset:0;background:#fff;z-index:7;animation:cfl .7s ease both;pointer-events:none}
@keyframes cfl{from{opacity:.95}to{opacity:0}}
/* 컷인 */
.cutin{position:fixed;inset:0;z-index:280;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);animation:cfin .12s;overflow:hidden}
.cutin.out{opacity:0;transition:opacity .25s}
.cutin .cspeed{position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0 5deg,rgba(255,255,255,.14) 5deg 6deg);animation:cspin 1.2s linear infinite}
@keyframes cspin{to{transform:rotate(30deg) scale(1.2)}}
.cutin .cart{position:relative;transform:translateX(-120vw) rotate(-6deg) scale(1.15);animation:cart .35s .05s cubic-bezier(.2,.9,.2,1) forwards;filter:drop-shadow(0 0 24px var(--acc,#fff))}
@keyframes cart{to{transform:translateX(-12vw) rotate(-3deg) scale(1.3)}}
.cutin .cname2{position:absolute;left:0;right:0;bottom:24%;text-align:center;font-size:clamp(30px,9vw,60px);font-weight:900;color:#fff;font-style:italic;text-shadow:0 0 22px var(--acc,#fff),0 4px 0 #000;transform:translateX(100vw);animation:cnm .3s .2s ease-out forwards;font-family:var(--disp,inherit)}
@keyframes cnm{to{transform:skewX(-8deg)}}
/* 아레나 */
.arena{position:relative;transition:transform .2s}
.arena.zoom{transform:scale(1.05)}
.arena .slash{position:absolute;left:12%;right:12%;top:30%;height:6px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 18px 4px var(--acc,#fff);transform:rotate(-24deg) scaleX(0);opacity:0;pointer-events:none;z-index:6}
.arena .slash.go{animation:slh .38s ease-out}
@keyframes slh{0%{transform:rotate(-24deg) scaleX(0);opacity:1}50%{transform:rotate(-24deg) scaleX(1);opacity:1}100%{transform:rotate(-24deg) scaleX(1.1);opacity:0}}
.arena .combo{position:absolute;left:50%;margin-left:-40px;top:34%;z-index:7;font-weight:900;font-style:italic;font-size:18px;color:#fff;text-shadow:0 2px 0 #000,0 0 10px var(--acc);opacity:0;transition:.2s;pointer-events:none}
.arena .combo.on{opacity:1}.arena .combo small{font-size:26px;margin-left:4px}
.arena .combo.hot{color:#ffd54a;transform:scale(1.1)}.arena .combo.fev{color:#ff6a3d;transform:scale(1.25);animation:cfev .5s infinite alternate}
@keyframes cfev{to{text-shadow:0 2px 0 #000,0 0 22px #ff6a3d}}
.arena.fever::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 40px 6px rgba(255,120,40,.55);animation:cfev2 .7s infinite alternate;z-index:5}
@keyframes cfev2{to{box-shadow:inset 0 0 60px 12px rgba(255,60,40,.7)}}
.arena.ph2{filter:saturate(1.25) hue-rotate(-10deg)}.arena.ph3{filter:saturate(1.5) hue-rotate(-25deg) contrast(1.06)}
.arena.ph3 .foe .spr{animation:cshk .4s infinite}
.arena .bubble{position:absolute;max-width:62%;padding:8px 12px;border-radius:12px;font-size:13px;font-weight:700;line-height:1.4;z-index:8;opacity:0;pointer-events:none;color:#111;background:#fffffff2;box-shadow:0 4px 14px #0006}
.arena .bubble.foe{right:6px;top:10px;background:#2a0f1a;color:#ffd0d8;border:1px solid #ff5a78}
.arena .bubble.hero{left:6px;top:10px}
.arena .bubble.go{animation:bub 2.4s ease both}
@keyframes bub{0%{opacity:0;transform:translateY(8px) scale(.9)}12%,80%{opacity:1;transform:none}100%{opacity:0}}
/* 타이머 */
.tmr{position:relative;height:8px;margin:0 12px 4px;border-radius:6px;background:#0003;overflow:hidden}
.tmr i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--acc),var(--acc2,var(--acc)));transition:width .1s linear}
.tmr span{position:absolute;right:6px;top:-1px;font-size:8px;font-weight:900;color:#fff;mix-blend-mode:difference}
.tmr.warn i{background:#ff3b5c;animation:cfev .3s infinite alternate}
/* 엔딩 / 스토리 목록 */
.ending{position:fixed;inset:0;z-index:310;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,var(--acc2,#334),#000 75%);color:#fff;text-align:center;padding:24px;animation:cfin 1s}
.ending.out{opacity:0;transition:.3s}
.ending .einner{position:relative;max-width:460px}
.ending h1{font-size:clamp(44px,14vw,86px);margin:6px 0;color:var(--acc);text-shadow:0 0 30px var(--acc)}
.ending .eline{font-style:italic;opacity:.85;margin:0 0 14px}.ending .etext{line-height:1.7;margin-bottom:18px}
.ending .estats{display:flex;justify-content:center;gap:22px;margin-bottom:22px}.ending .estats b{display:block;font-size:24px;color:var(--acc)}.ending .estats span{font-size:11px;opacity:.8}
.panel.story .recap{font-size:13.5px;line-height:1.65;margin:6px 0 10px;white-space:pre-wrap}
.panel.letter{border-left:4px solid var(--acc);font-size:14px}.panel.letter p{margin:4px 0 0;line-height:1.6}
.slist .srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #8883;font-size:13.5px}
.slist .sbtns{display:flex;gap:6px}.slist .slh{margin:12px 0 2px;font-size:14px}.slist .slk{opacity:.5;font-style:normal}
.slist .buy.sm{padding:5px 10px;font-size:12px}

/* 여학생 버전: 라일락 바탕에 핫핑크와 바이올렛. 밝은 무대 위 성장 이야기. 단일 라이트 테마로 고정. */
:root{
  --page:#fff0f8;--app:linear-gradient(#fff8fd,#f4e9ff);
  --panel:#ffffff;--panel2:#fff7fc;--line:#f0cfe6;--ink:#3a1747;--sub:#80609a;
  --acc:#e0359a;--acc2:#8a3fe0;--hp:linear-gradient(90deg,#ff5fa2,#ff9ac6);--mp:linear-gradient(90deg,#5b8cff,#9fe0ff);--xp:linear-gradient(90deg,#a24bff,#e06bff);--ult:linear-gradient(90deg,#ffb62e,#ff6fb1);
  --ok:#0fae72;--bad:#ff3d77;--okbg:#e3fbf1;--badbg:#ffe5ee;
  --btn:linear-gradient(180deg,#ff77bb,#e0359a);--btnc:#fff;--btns:0 5px 0 #a81f6f,0 12px 20px rgba(224,53,154,.28);--btnsa:0 2px 0 #a81f6f,0 6px 12px rgba(224,53,154,.25);
  --off:#eadcf2;--offc:#a58bba;--ghost:#fff;
  --chip:#ffe3f3;--chipc:#b0246f;--track:#f2e6f8;--opt:#fffafd;
  --tpbg:#efe2ff;--tpc:#5a22a8;--shade:rgba(40,8,60,.86);--hudbg:rgba(255,255,255,.94);--navbg:#ffffff;
  --avabg:radial-gradient(circle at 50% 30%,#ffe9f5,#e5d4ff);--bossglow:#ff5cb8;--foehp:linear-gradient(90deg,#ffd23c,#ff6fb5);
  --bannerc:#ff3fa4;--bannerc2:#8a3fe0;--shadow:0 8px 22px rgba(160,60,160,.16);--r:22px;--rb:20px;--logof:none;
  --f-disp:'Jua','Noto Sans KR',system-ui,sans-serif;--f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
.disp,.hbody h2,.thead h1,.result h1,.mbox h3,.grade,.banner,.float{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}

.motto{font-family:'Poppins','Noto Sans KR',sans-serif;font-weight:600;letter-spacing:.08em;color:var(--acc2)}
.tscene::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#fff8fd)}
.clsb small{white-space:pre-line}
.hbody p{color:#f1e6ff}
.banner{font-size:36px;letter-spacing:.02em}
.arena{border:2px solid #ffb3de;box-shadow:0 8px 24px rgba(224,53,154,.25)}
.arena.boss{border-color:#ffd45e;box-shadow:0 0 0 2px #ffd45e,0 0 26px rgba(255,212,94,.5)}
.nm2{background:rgba(40,8,60,.72);border:1px solid #ffb3de}
.foe .spr{filter:drop-shadow(0 4px 10px rgba(255,111,181,.7))}
.tp{border:1px solid #d9c2ff}
.opt{box-shadow:0 2px 0 var(--line)}
.opt.right{box-shadow:0 2px 0 var(--ok)}
.toast{background:#3a1747;color:#fff}
.rankup{color:var(--acc)}
.career li.done{background:var(--chip)}
.pt{font-size:18px}
.ava{border-color:#ff9ad5}
.grade{text-shadow:0 0 24px rgba(224,53,154,.5)}
.gC{color:var(--sub)}
.modal{background:rgba(58,23,71,.6)}
.hscene svg{filter:none}
.arena .slash{height:0;width:0;left:50%;top:35%;background:none;box-shadow:none;transform:none;font-size:46px;text-align:center}

.arena .slash.go{animation:gsl .6s ease-out}
@keyframes gsl{0%{opacity:0;transform:scale(.3) rotate(-20deg)}35%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.5) translateY(-30px)}}
.cine .cbox{background:rgba(60,20,70,.78);border-color:#ffb3e0aa}

        var cc = ctr(monEl); burst(cc[0], cc[1], crit ? T.crit : T.hitc, crit ? 26 : 14, crit ? 130 : 80);
        floatTxt(T.dmg(crit, B.combo, fm), crit ? "var(--bannerc)" : "#fff", monEl, crit);
        var sl = $("slash"); if (sl) { sl.classList.remove("go"); void sl.offsetWidth; sl.classList.add("go"); }
        if (crit) { shake(); flash("crit"); var ar = $("arena"); if (ar) { ar.classList.add("zoom"); setTimeout(function () { ar.classList.remove("zoom"); }, 260); } }
        if (!B.boss && foeEl) setTimeout(function () { foeEl.classList.add("die"); }, 160);
        updHud();
      }, 200);
      if (crit) { SFX.crit(); banner(T.L.crit + " ×" + B.combo, "var(--bannerc)"); } else { SFX.ok(); if (B.combo >= 2) banner(T.L.combo + " ×" + B.combo, "var(--bannerc2)"); }
      updCombo();
      if (B.combo === 5) { setTimeout(function () { banner(T.L.fever + "!", "var(--bannerc)"); SFX.boss(); toast(T.L.hot); }, 700); }
      else if ((B.combo === 3 || B.combo === 7) && ST.cheer) { var ch2 = pick(ST.cheer); setTimeout(function () { bubble("hero", ch2[1], (ST.chars[ch2[0]] || {}).ic); }, 650); }
      if (B.boss) { var rem = (B.list.length - B.ok) / B.list.length, ph = rem > 0.66 ? 1 : rem > 0.33 ? 2 : 3; if (ph > B.phase) { B.phase = ph; setTimeout(function () { bossPhase(ph); }, 900); } }
    } else {
      B.combo = 0; S.wrong[q.id] = 1; updCombo();
      if (ST.taunt && Math.random() < 0.6) setTimeout(function () { bubble("foe", pick(ST.taunt)); }, 500);
      var dmg = Math.round((24 + 6 * zi) * (B.boss ? 1.5 : 1) * (1 - Math.min(0.5, sum("red"))));
      if (B.shield) { B.shield = 0; dmg = 0; toast(T.L.shielded); }
      B.hp = Math.max(0, B.hp - dmg);
      if (foeEl) { foeEl.classList.remove("fatk"); void foeEl.offsetWidth; foeEl.classList.add("fatk"); }
      setTimeout(function () {
        if (heroEl) { heroEl.classList.remove("hurt"); void heroEl.offsetWidth; heroEl.classList.add("hurt"); }
        var cc = ctr(heroEl); burst(cc[0], cc[1], T.hurtc, 12, 70);
        floatTxt(dmg ? T.hurtTxt(dmg) : T.L.guard, "var(--bad)", heroEl, false); shake(); flash("hurt"); updHud();
        var ap = $("app"); if (ap) ap.classList.toggle("danger", B.hp > 0 && B.hp < B.hpMax * 0.3);
      }, 260);
      SFX.bad();
    }
    updHud(); renderQ(); renderBar();
    var f = document.querySelector(".fb"); if (f) setTimeout(function () { f.scrollIntoView({ behavior: "smooth", block: "nearest" }); }, 120);
    if (B.hp <= 0) { var b = $("bbar"); if (b) b.innerHTML = '<button type="button" class="btn" data-act="lose">' + T.L.next + "</button>"; }
  }
  function doPick(k) {
    var c = B.cur; if (c.done || c.busy || c.elim.indexOf(k) >= 0) return;
    c.sel = k; resolve(c.opts[k].o === c.q.a);
  }
  function doSubmit() {
    var c = B.cur, inp = $("ty"); if (c.done || c.busy || !inp) return;
    var v = inp.value.trim(); if (!v) { toast(T.L.typeFirst); return; }
    c.typed = v; resolve(c.q.acc.some(function (x) { return norm(x) === norm(v); }));
  }
  function doUlt() {
    var c = B.cur, q = c.q; if (c.done || c.busy || B.ult < 100) return;
    B.ult = 0; c.busy = true; updHud(); renderBar();
    cutin(CL().ult, function () {
      c.busy = false; flash("crit");
      if (q.t === "f") { c.typed = q.acc[0]; } else { c.sel = c.opts.findIndex(function (o) { return o.o === q.a; }); }
      resolve(true, true);
    });
  }
  function usePot(k) {
    if (!S.pot[k]) return; var done = false;
    if (k === "hp" && B.hp < B.hpMax) { B.hp = Math.min(B.hpMax, B.hp + Math.round(B.hpMax * 0.5)); done = true; floatTxt("+" + Math.round(B.hpMax * 0.5), "var(--ok)", $("hero")); var ap = $("app"); if (ap) ap.classList.toggle("danger", B.hp < B.hpMax * 0.3); }
    if (k === "mp" && B.mp < B.mpMax) { B.mp = Math.min(B.mpMax, B.mp + 15); done = true; floatTxt("+15", "#5cc8ff", $("hero")); }
    if (done) { S.pot[k]--; SFX.coin(); save(); updHud(); renderBar(); }
  }
  function nextQ() {
    if (B.hp <= 0) { return defeat(); }
    B.i++;
    if (B.i >= B.list.length) return victory();
    prepQ(); battle(false);
    var st = $("stg"); if (st) st.scrollTo({ top: 0 });
  }
  function fallQuote() { var fq = pick(ST.fall), fc = ST.chars[fq[0]] || ST.chars.N; return '<div class="panel letter"><b>' + esc(fc.n || ST.title) + "</b><p>" + esc(fmt(fq[1])) + "</p></div>"; }
  function defeat(soft) {
    stopTimer();
    var n = B.list.length, passN = Math.ceil(n * 0.6), from = gainXp(B.xp);
    S.fame += B.fame; setMusic("town"); SFX.lose(); var ap = $("app"); if (ap) ap.classList.remove("danger"); save();
    show('<div class="scroll result lose"><div class="rbig">' + T.L.loseIc + '</div><h1 class="disp">' + (soft ? T.L.failT : T.L.loseT) + "</h1><p class=\"sub\">" + (soft ? T.L.failS.replace("{n}", passN) : T.L.loseS) + '</p><div class="panel"><div class="kv"><span>' + T.L.statOk + "</span><b>" + B.ok + " / " + n + '</b></div><div class="kv"><span>EXP</span><b>+' + B.xp + '</b></div><div class="kv"><span>' + T.coin + "</span><b>+" + B.gold + "</b></div></div>" + fallQuote() +
      '<button type="button" class="btn" data-act="retry">' + T.L.retry + '</button><button type="button" class="btn ghost" data-act="tab" data-v="quest">' + T.L.toMap + '</button><button type="button" class="btn ghost" data-act="tab" data-v="note">' + T.L.note + "</button></div>");
    if (from) setTimeout(function () { levelUpModal(from); }, 500);
  }
  function victory() {
    stopTimer();
    var n = B.list.length, g = gradeOf(B.ok, n), first = false, bonusX = 0, bonusG = 0, trophy = null;
    if (!B.review && g === "C") return defeat(true);
    var ap = $("app"); if (ap) ap.classList.remove("danger");
    if (!B.review) {
      var st = B.st, prev = S.cleared[st.id];
      var rank = { S: 4, A: 3, B: 2, C: 1 };
      first = !prev;
      if (!prev || rank[g] > rank[prev]) S.cleared[st.id] = g;
      if (first) { bonusX = st.boss ? 60 : 25; bonusG = st.boss ? 60 : 25; } else { bonusX = 6; bonusG = 6; }
      if (g === "S") { S.stat.perfect++; bonusX += 10; }
      if (first && st.boss && st.ch.stages.every(function (s) { return S.cleared[s.id]; }) && !S.trophy[st.ch.id]) { S.trophy[st.ch.id] = 1; trophy = T.trophy(st.ch); }
    } else { bonusX = 6; bonusG = 6; }
    S.gold += bonusG; B.gold += bonusG; B.xp += bonusX; S.fame += B.fame;
    var from = gainXp(B.xp);
    var extra = checkAch(); save();
    SFX.win(); setMusic("town");
    var next = !B.review ? nextStage() : null;
    var letter = pick(T.after);
    if (B.review) { var rv = ST.review[0]; letter = [(ST.chars[rv[0]] || ST.chars.N).n || ST.title, fmt(rv[1])]; }
    var wrongList = B.list.filter(function (id, k) { return !B.res[k]; });
    show('<div class="scroll result win"><div class="rscene">' + T.zones[B.zi].scene(false) + '</div><div class="rhero">' + T.avatar(S, 150, "win") + "</div>" +
      '<p class="eyebrow">' + (B.review ? T.L.reviewDone : B.boss ? T.L.bossClear : T.L.stageClear) + '</p><div class="grade g' + g + '">' + g + '</div><h1 class="disp">' + (g === "S" ? T.L.perfect : g === "C" ? T.L.tough : T.L.nice) + "</h1>" +
      '<div class="panel rewards"><div class="kv"><span>' + T.L.statOk + "</span><b>" + B.ok + " / " + n + "</b></div><div class=\"kv\"><span>" + T.L.statCombo + "</span><b>" + B.best + "</b></div>" +
      '<div class="kv"><span>EXP</span><b>+' + B.xp + '</b></div><div class="kv"><span>' + T.coin + '</span><b>+' + B.gold + '</b></div><div class="kv"><span>' + T.L.fame + "</span><b>+" + Math.round(B.fame).toLocaleString("ko-KR") + "</b></div>" +
      (first && !B.review ? '<p class="firstb">' + T.L.first + "</p>" : "") + "</div>" +
      (trophy ? '<div class="panel trophyp"><div class="tbig">' + trophy.ic + '</div><div><b>' + T.L.trophyGet + "</b><span>" + esc(trophy.n) + "</span></div></div>" : "") +
      '<div class="panel letter"><b>' + esc(letter[0]) + "</b><p>" + esc(letter[1]) + "</p></div>" +
      (wrongList.length ? '<p class="sub">' + T.L.wrongSaved.replace("{n}", wrongList.length) + "</p>" : "") +
      (next ? '<button type="button" class="btn" data-act="stage" data-v="' + next.id + '">' + T.L.goNext + "</button>" : "") +
      '<button type="button" class="btn ghost" data-act="tab" data-v="quest">' + T.L.toMap + '</button><button type="button" class="btn ghost" data-act="tab" data-v="home">' + T.L.toHome + "</button></div>");
    setTimeout(function () { burst(innerWidth / 2, innerHeight / 3, T.confetti, 40, 200); }, 250);
    var vst = B.st, vzi = B.zi, vrev = B.review, q2 = [];
    if (!vrev) afterScenes(vst).forEach(function (sc) { q2.push(function (n) { cutscene(sc[0], sc[1], n, sc[2]); }); });
    if (!vrev && vst.boss) q2.push(function (n) { if (S.seen.ep && !S.seen.end) endingCard(n); else n(); });
    q2.push(function (n) { if (from) levelUpModal(from, n); else n(); });
    q2.push(function (n) { var ri = rankIdx(S.lv); if (from && ri > rankIdx(from) && ST.ranks[ri] && !S.seen["rk" + ri]) cutscene("rk" + ri, ST.ranks[ri], n, vzi); else n(); });
    setTimeout(function () { runQueue(q2); }, 1100);
  }
  function claim() {
    var d = dly(); if (d.claimed || d.ok < 10) return;
    d.claimed = 1; S.streak = S.lastClaim === yday() ? S.streak + 1 : 1; S.lastClaim = today(); S.gold += 80; S.pot.hp++; SFX.coin(); save(); toast(T.L.claimMsg); home();
  }
  function shareText() {
    return T.share(S, { rank: rankOf(S.lv), cls: CL().n, nCleared: nCleared(), NS: NS, ok: S.stat.ok });
  }

  /* ---------- 이벤트 ---------- */
  view.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    var a = b.dataset.act, v = b.dataset.v;
    if (a !== "pick") SFX.click();
    switch (a) {
      case "cls": view.dataset.cls = v; view.querySelectorAll(".clsb").forEach(function (x) { x.classList.toggle("on", x === b); }); break;
      case "begin":
        S = Object.assign(blank(), { name: ($("nm").value.trim() || T.L.defName).slice(0, 10), cls: view.dataset.cls || Object.keys(T.classes)[0] }); save(); cutscene("pro", ST.prologue, function () { tab("home"); }, 0); break;
      case "storylog": storyLog(); break;
      case "replay": var scn = sceneById(v); cutscene(v, scn[0], function () { storyLog(); }, scn[1], true); break;
      case "act": S.act = (S.act + 1) % 3; save(); me(); break;
      case "tab": tab(v); break;
      case "zone": S.zone = +v; save(); quest(); break;
      case "stage": var st = STG[v]; if (!stageOpen(st)) { toast(T.L.bossLock); break; } startStage(st); break;
      case "review": startStage(null, true); break;
      case "retry": startStage(B.review ? null : B.st, B.review); break;
      case "flee": modal('<h3>' + T.L.fleeT + '</h3><p class="sub">' + T.L.fleeS + '</p><button type="button" class="btn" data-close="1">' + T.L.stay + '</button><button type="button" class="btn ghost" data-act="leave">' + T.L.leave + "</button>").addEventListener("click", function (ev) { if (ev.target.closest("[data-act=leave]")) { document.querySelectorAll(".modal").forEach(function (m) { m.remove(); }); B = null; tab("quest"); } }); break;
      case "pick": doPick(+v); break;
      case "submit": doSubmit(); break;
      case "hint": doHint(); break;
      case "ult": doUlt(); break;
      case "phr": usePot("hp"); break;
      case "pmp": usePot("mp"); break;
      case "tts": speakQ(B.cur.q); break;
      case "next": nextQ(); break;
      case "lose": defeat(); break;
      case "claim": claim(); break;
      case "buypot": var p = T.potions[v]; if (S.gold >= p.p) { S.gold -= p.p; S.pot[v]++; SFX.coin(); save(); shop(); } break;
      case "buyitem": var it = T.items.filter(function (i) { return i.id === v; })[0]; if (S.gold >= it.p) { S.gold -= it.p; S.own[v] = 1; S.eq[it.slot] = v; SFX.coin(); save(); shop(); toast(it.n + " " + T.L.bought); } break;
      case "equip": var it2 = T.items.filter(function (i) { return i.id === v; })[0]; S.eq[it2.slot] = S.eq[it2.slot] === v ? "" : v; save(); shop(); break;
      case "tog": S[v] = S[v] ? 0 : 1; save(); if (v === "mus") applyMusic(); me(); break;
      case "share": var tx = shareText(); (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(tx) : Promise.reject()).then(function () { toast(T.L.copied); }, function () { modal('<h3>' + T.L.share + '</h3><textarea class="ta" readonly rows="6">' + esc(tx) + '</textarea><button type="button" class="btn" data-close="1">' + T.L.ok + "</button>"); }); break;
      case "wipe": modal('<h3>' + T.L.wipeT + '</h3><p class="sub">' + T.L.wipeS + '</p><button type="button" class="btn ghost" data-close="1">' + T.L.cancel + '</button><button type="button" class="btn danger" data-act="wipe2">' + T.L.wipe + "</button>"); break;
      case "wipe2": try { localStorage.removeItem(KEY); } catch (er) {} S = blank(); document.querySelectorAll(".modal").forEach(function (m) { m.remove(); }); create(); break;
    }
  });
  document.body.addEventListener("click", function (e) {
    var b = e.target.closest(".modal [data-act]"); if (!b) return;
    var a = b.dataset.act;
    if (a === "wipe2") { try { localStorage.removeItem(KEY); } catch (er) {} S = blank(); document.querySelectorAll(".modal").forEach(function (m) { m.remove(); }); create(); }
  });
  view.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.id === "ty") doSubmit(); });
  document.addEventListener("keydown", function (e) {
    if (!B || !B.cur || B.cur.done || !$("qa")) return;
    var k = +e.key; if (k >= 1 && k <= 4 && B.cur.opts && B.cur.opts[k - 1] && document.activeElement.tagName !== "INPUT") doPick(k - 1);
  });

  window.GQ = { S: function () { return S; }, B: function () { return B; }, QM: QM, CH: CH, ORDER: ORDER, STG: STG, startStage: startStage, tab: tab, nCleared: nCleared };
  document.body.className = "t-" + T.id;
  window.GQ.cutscene = cutscene; window.GQ.endingCard = endingCard;
  if (S.cls) {
    dly(); var t0 = S.tab && ["home", "quest", "shop", "note", "me"].indexOf(S.tab) >= 0 ? S.tab : "home";
    tab(t0);
    if (!S.seen.pro) setTimeout(function () { cutscene("pro", ST.prologue, null, 0); }, 400);
  } else create();
})();

</script>
